# nPanel Nginx Monitoring Configuration
# Add this to your main nginx.conf or include it

server {
    listen 127.0.0.1:80;
    server_name localhost;

    # Nginx stub_status for monitoring
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # PHP-FPM status endpoints (dynamically configured per pool)
    # Pattern: /php-fpm-status-{pool_name}
    location ~ ^/php-fpm-status-(.+)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # This will be handled by the specific pool's socket
        # The socket path needs to match the pool configuration
        fastcgi_pass unix:/var/run/php/php-fpm-$1.sock;
    }

    # PHP-FPM ping endpoints
    location ~ ^/php-fpm-ping-(.+)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php-fpm-$1.sock;
    }
}
